services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cinegraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${CINEGRAPH_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinegraph"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: ./backend
    command: python -m app.migrations
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cinegraph
    depends_on:
      db:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cinegraph
      API_CORS_ORIGINS: http://localhost:3000
      RAW_SNAPSHOT_ROOT: /var/lib/cinegraph/raw-snapshots
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ADMIN_INTAKE_TOKEN: ${CINEGRAPH_ADMIN_TOKEN:-}
      IMDB_DATA_DIR: /imports/imdb
      IMDB_INDEX_DIR: /app/data/imdb_index
    ports:
      - "${CINEGRAPH_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - raw_snapshots:/var/lib/cinegraph/raw-snapshots
      - ./data:/app/data:ro
      - ./imdb_data:/imports/imdb:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  ingest:
    profiles: ["tools"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cinegraph
      RAW_SNAPSHOT_ROOT: /var/lib/cinegraph/raw-snapshots
    volumes:
      - raw_snapshots:/var/lib/cinegraph/raw-snapshots
      - ./data:/app/data
      - ./imdb_data:/imports/imdb:ro
      - ./name.basics.tsv:/imports/name.basics.tsv:ro
      - ./tmdb_api.env:/run/secrets/tmdb_api.env:ro
    depends_on:
      db:
        condition: service_healthy
  intake_worker:
    build: ./backend
    command: python -m app.services.movie_intake_worker
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cinegraph
      RAW_SNAPSHOT_ROOT: /var/lib/cinegraph/raw-snapshots
      IMDB_DATA_DIR: /imports/imdb
      IMDB_INDEX_DIR: /app/data/imdb_index
    volumes:
      - raw_snapshots:/var/lib/cinegraph/raw-snapshots
      - ./data:/app/data
      - ./imdb_data:/imports/imdb:ro
      - ./name.basics.tsv:/imports/name.basics.tsv:ro
      - ./tmdb_api.env:/run/secrets/tmdb_api.env:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000/api/v1
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
    ports:
      - "${CINEGRAPH_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  raw_snapshots:
