services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cinegraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinegraph"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/cinegraph
      API_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000/api/v1
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
